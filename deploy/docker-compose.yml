services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flux_transcoder_postgres_db
    restart: always
    # без предзагрузки расширения: "extension must be preloaded"
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      # значения из deploy/.env (не в git), образец: deploy/.env.example
      POSTGRES_USER: ${POSTGRES_USER:?задайте в deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-flux_transcoder_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: flux_transcoder_rabbitmq_broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?задайте в deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?задайте в deploy/.env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  
  nginx:
    image: nginx:alpine
    container_name: flux-nginx
    ports:
      - "3088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - D:/fluxcast/storage:/srv/hls:ro
      # для NAS: вместо строки выше — - hls_storage:/srv/hls:ro (см. volume ниже)
    restart: always

volumes:
  postgres_data:
  rabbitmq_data:

  # Шара NAS напрямую по SMB (диск Z: из Windows в WSL2/Docker не пробрасывается).
  # Значения — в deploy/.env (не коммитить): NAS_HOST, NAS_SHARE, NAS_USER, NAS_PASSWORD.
  # hls_storage:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: "//${NAS_HOST}/${NAS_SHARE}"
  #     o: "username=${NAS_USER},password=${NAS_PASSWORD},vers=3.0,ro"