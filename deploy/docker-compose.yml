services:
  postgres:
    image: postgres:16-alpine
    container_name: flux_transcoder_postgres_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass12345
      POSTGRES_DB: flux_transcoder_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: flux_transcoder_rabbitmq_broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: dev_user
      RABBITMQ_DEFAULT_PASS: dev_pass12345
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  
  nginx:
    image: nginx:alpine
    container_name: flux-nginx
    ports:
      - "3088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - D:/fluxcast/storage:/srv/hls:ro
    restart: unless-stopped
  
volumes:
  postgres_data:
  rabbitmq_data:   